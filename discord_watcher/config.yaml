# Discord 用户消息监听转发配置

# ============================================
# Discord 用户令牌（必填）
# ============================================
# 获取方法：
# 1. 在浏览器中打开 Discord 并登录
# 2. 按 F12 打开开发者工具
# 3. 切换到 Network 标签
# 4. 刷新页面，找到任意请求，查看请求头中的 "Authorization"
# 5. 复制该值（注意：不要包含引号）
discord_token: ""

# ============================================
# 调度配置（二选一）
# ============================================

# 方式1: 直接指定 cron 表达式（推荐）
# 格式: 分 时 日 月 周
# 示例:
#   "*/5 * * * *"    每5分钟
#   "0 * * * *"      每小时整点
#   "0 */6 * * *"    每6小时
#   "0 9 * * 1-5"    工作日9点
#   "0 0 * * *"      每天0点
cron: "*/5 * * * *"

# ============================================
# 状态文件
# 用于保存最后读取的消息ID，重启后从该位置继续
# ============================================
state_file: ".discord_watcher_state.json"

# ============================================
# 企业微信推送（可选）
# 获取方法：在企业微信群中添加机器人，复制 webhook 地址
# ============================================
wecom_webhook: ""

# ============================================
# 监听配置
# ============================================

# 要监控的频道列表
channels:
  # 示例配置1：监听特定用户
  # - guild_id: "1234567890123456789"
  #   channel_id: "9876543210987654321"
  #   name: "频道名称"
  #   # 该频道的监听用户（按 global_name 匹配）
  #   # 留空或省略则监听该频道所有用户
  #   watch_users:
  #     - "用户名1"
  #     - "用户名2"

  # 示例配置2：监听所有用户
  # - guild_id: "1234567890123456789"
  #   channel_id: "9876543210987654321"
  #   name: "另一个频道"
  #   # 不配置 watch_users 则监听所有用户

  - guild_id: ""
    channel_id: ""
    name: "默认频道"
    watch_users: []

# 上下文消息数量
# 当监听到目标用户发言时，同时输出前后各 N 条消息
# 如果多个目标用户发言的上下文有重叠，会自动合并
context_count: 10

# 单次请求获取的消息数量（Discord API 限制最大100）
limit: 100

# 显示设置
display:
  # 是否显示时间戳
  show_timestamp: true
  # 时区设置（IANA 时区名称，如 Asia/Shanghai、America/New_York）
  # 留空或省略则使用 UTC
  timezone: "Asia/Shanghai"
  # 时间戳格式
  timestamp_format: "%H:%M:%S"
  # 是否显示附件信息
  show_attachments: true
  # 是否显示表情反应
  show_reactions: true

# 日志设置
logging:
  # 日志级别: DEBUG, INFO, WARNING, ERROR
  level: "INFO"
  # 是否保存日志到文件
  save_to_file: false
  # 日志文件路径
  log_file: "discord_watcher.log"

# 代理设置（支持 Clash 等 HTTP/HTTPS 代理）
proxy:
  # 是否启用代理
  enabled: false
  # 代理地址（Clash 默认 http://127.0.0.1:7890）
  # 格式: http://host:port 或 https://host:port
  # 如果 Clash 使用 SOCKS5，格式为: socks5://host:port
  url: "http://127.0.0.1:7890"

# 高级设置
advanced:
  # 最大重试次数
  max_retries: 3
  # 请求超时时间（秒）
  timeout: 30
  # 连接池大小
  connection_pool_size: 10
  # 分页请求间隔（秒）
  page_delay: 1.5
